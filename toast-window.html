<!doctype html>
<html lang="en" class="no-background">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' file: glaze-core: http://localhost:* http://127.0.0.1:* http://0.0.0.0:*; style-src 'self' 'unsafe-inline' file: glaze-core: http://localhost:* http://127.0.0.1:* http://0.0.0.0:*; img-src 'self' data: blob: file: local: ipc: glaze-core: https: http://localhost:* http://127.0.0.1:* http://0.0.0.0:*; font-src 'self' data: file: glaze-core:; connect-src 'self' file: local: ipc: glaze: glaze-core: https: http://localhost:* http://127.0.0.1:* http://0.0.0.0:* ws://localhost:* ws://127.0.0.1:* ws://0.0.0.0:*; media-src 'self' data: blob: file: local: ipc: https:; worker-src 'self' blob:; frame-src 'self' blob: data:"
    />
    <title>Quick2Afvault</title>
    <script>
      if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.classList.add("dark");
      }
    </script>
    <style>
      :root {
        --toast-bg: #ffffff;
        --toast-fg: #1c1c1e;
        --toast-fg-secondary: #6b6b70;
        --toast-border: rgba(0, 0, 0, 0.08);
        --toast-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
        --toast-accent: #007aff;
        --toast-warn: #c2410c;
        --toast-warn-bg: rgba(194, 65, 12, 0.12);
        --toast-accent-bg: rgba(0, 122, 255, 0.12);
      }
      .dark {
        --toast-bg: #2c2c2e;
        --toast-fg: #f5f5f7;
        --toast-fg-secondary: #a1a1a6;
        --toast-border: rgba(255, 255, 255, 0.1);
        --toast-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
        --toast-accent: #0a84ff;
        --toast-warn: #ff9f0a;
        --toast-warn-bg: rgba(255, 159, 10, 0.16);
        --toast-accent-bg: rgba(10, 132, 255, 0.16);
      }
      html,
      body,
      #root {
        margin: 0;
        background: transparent;
        overflow: hidden;
        height: 100%;
        width: 100%;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        display: flex;
        align-items: center;
        padding: 6px;
        box-sizing: border-box;
      }
      .toast {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border-radius: 14px;
        background: var(--toast-bg);
        border: 1px solid var(--toast-border);
        box-shadow: var(--toast-shadow);
        animation: toast-in 0.18s ease-out;
      }
      @keyframes toast-in {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .toast__icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        border-radius: 9px;
        flex-shrink: 0;
        color: var(--toast-accent);
        background: var(--toast-accent-bg);
      }
      .toast--warn .toast__icon {
        color: var(--toast-warn);
        background: var(--toast-warn-bg);
      }
      .toast__text {
        display: flex;
        flex-direction: column;
        min-width: 0;
        gap: 1px;
      }
      .toast__title {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--toast-fg);
        line-height: 1.25;
      }
      .toast__body {
        font-size: 11.5px;
        color: var(--toast-fg-secondary);
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./renderer/toast/index.ts"></script>
  </body>
</html>
